<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>사이</title>

    <!-- login.css 연결 -->
    <link rel="stylesheet" href="/css/login.css" />
  </head>

  <body>
    <!-- 헤더 부분 -->
    <header>
      <img class="logoIcon" src="/assets/logo_icon.svg" alt="앱 로고" />
      <b class="appName">사이</b>
      <div class="appInfo">대학 생활을 함께할 친구, 지금 만나요</div>
    </header>

    <main>
      <!-- 로그인 입력 폼 -->
      <form class="loginForm">
        <!-- 이메일 입력 -->
        <div class="inputContainer">
          <div class="label">학교 이메일</div>
          <div class="inputBorder">
            <img class="inputIcon" src="/assets/email_icon.svg" />
            <input
              class="userEmail"
              name="userEmail"
              placeholder="yourname@univ.ac.kr"
            />
          </div>
        </div>

        <!-- 비밀번호 입력 -->
        <div class="inputContainer">
          <div class="label">비밀번호</div>
          <div class="inputBorder">
            <img class="inputIcon" src="/assets/password_icon.svg" />
            <input
              class="userPassword"
              name="userPassword"
              type="password"
              placeholder="영문·숫자 8자 이상"
            />

            <!-- 비밀번호 토글 (비밀번호 숨기기/보여주기) -->
            <button class="passwordToggle">
              <img src="/assets/password_eye_icon.svg" />
            </button>
          </div>
        </div>

        <!-- 로그인 버튼 -->
        <input type="submit" value="로그인" class="loginBtn" />
      </form>

      <!-- 또는 소셜 계정으로 시작 -->
      <div class="socialContainer">
        <div class="socialDivider"></div>
        <span class="socialSpan"> 또는 소셜 계정으로 시작 </span>
      </div>

      <!-- 소셜 로그인 버튼 2개 -->
      <div class="socialIcons">
        <!-- Google 로그인 -->
        <button class="socialIconBg">
          <img class="socialIcon" src="/assets/google_icon.svg" />
        </button>

        <!-- Apple 로그인 -->
        <button class="socialIconBg">
          <img class="socialIcon" src="/assets/apple_icon.svg" />
        </button>
      </div>

      <!-- 회원가입, 비밀번호 재설정 -->
      <div class="spanBtns">
        <button class="spanBtn joinBtn">회원가입</button>
        <div>|</div>
        <button class="spanBtn">비밀번호 재설정</button>
      </div>
    </main>

    <!-- 푸터 부분 -->
    <footer>
      <!-- 푸터의 왼쪽 섹션 -->
      <div class="footerLeft">
        <div class="univIconBg">
          <img src="/assets/univ_icon.svg" />
        </div>
      </div>

      <!-- 푸터의 오른쪽 섹션 -->
      <div class="footerRight">
        <b>대학 인증&nbsp</b>
        <span class="footerSpan">후 외국인·내국인 친구를 만들어요.</span>

        <div class="footerP">
          <img src="/assets/translate_icon.svg" />
          <div>&nbsp채팅은 실시간 번역 지원</div>
        </div>
      </div>
    </footer>

    <!-- login.js 연결 -->
    <script src="/js/login.js"></script>
  </body>
</html>
